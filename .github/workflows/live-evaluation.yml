name: Controlled live-model evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider (Gemini is the free-tier default)
        required: true
        default: gemini
        type: choice
        options:
          - gemini
          - openai
      model:
        description: Provider-native model name or pinned snapshot
        required: true
        default: gemini-3.6-flash
        type: string
      max_cases:
        description: Number of versioned synthetic cases to run
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

permissions:
  contents: read

concurrency:
  group: opspilot-live-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-evaluation
    env:
      GEMINI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
      OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
      LIVE_PROVIDER: ${{ inputs.provider }}
      LIVE_MODEL: ${{ inputs.model }}
      LIVE_MAX_CASES: ${{ inputs.max_cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Require the selected provider's protected runtime secret
        run: |
          if [ "${LIVE_PROVIDER}" = "gemini" ]; then
            test -n "${GEMINI_API_KEY}"
          else
            test -n "${OPENAI_API_KEY}"
          fi
      - name: Run the bounded live evaluation
        run: >-
          python scripts/run_live_agent_eval.py
          --confirm-live-api
          --provider "${LIVE_PROVIDER}"
          --model "${LIVE_MODEL}"
          --max-cases "${LIVE_MAX_CASES}"
          --timeout-seconds 30
          --max-output-tokens 4096
          --reasoning-effort low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agent-evaluation
          path: artifacts/evaluations/live-agent-eval.json
          if-no-files-found: error
