apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-config
data:
  OPSPILOT_ENVIRONMENT: production
  OPSPILOT_RETRIEVAL_BACKEND: postgres
  OPSPILOT_EMBEDDING_PROVIDER: openai
  OPSPILOT_EMBEDDING_MODEL: text-embedding-3-small
  OPSPILOT_EMBEDDING_DIMENSIONS: "1536"
  OPSPILOT_CORPUS_DIR: fixtures/runbooks
  OPSPILOT_INVESTIGATION_PROVIDER: openai
  OPSPILOT_INVESTIGATION_MODEL: gpt-5.6
  OPSPILOT_DATABASE_POOL_MIN_SIZE: "1"
  OPSPILOT_DATABASE_POOL_MAX_SIZE: "8"
  OPSPILOT_APPROVAL_TTL_SECONDS: "900"
  OPSPILOT_EXECUTION_LEASE_TTL_SECONDS: "30"
  OPSPILOT_TELEMETRY_EXPORTER: otlp
  OPSPILOT_OTLP_ENDPOINT: http://otel-collector:4318
