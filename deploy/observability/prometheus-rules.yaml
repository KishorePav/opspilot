groups:
  - name: opspilot-slos
    interval: 30s
    rules:
      - record: opspilot:http_availability:ratio_5m
        expr: >-
          1 - sum(rate(opspilot_http_server_requests_total{route=~"/v1/.*",status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(opspilot_http_server_requests_total{route=~"/v1/.*"}[5m])), 0.001)
      - record: opspilot:http_duration:p95_5m
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(opspilot_http_server_duration_seconds_bucket{route=~"/v1/.*"}[5m])))
      - alert: OpsPilotAvailabilityBurnRateHigh
        expr: opspilot:http_availability:ratio_5m < 0.995
        for: 10m
        labels:
          severity: page
        annotations:
          summary: OpsPilot is consuming its availability error budget quickly
      - alert: OpsPilotWorkflowErrors
        expr: >-
          sum(rate(opspilot_workflow_operations_total{outcome="error"}[10m])) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: OpsPilot workflow operations are failing above the review threshold
      - alert: OpsPilotLeaseRecoveries
        expr: increase(opspilot_remediation_lease_recoveries_total[15m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: An abandoned remediation execution lease was recovered
