[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.6.0"
description = "Evidence-first production incident investigation reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Kishore Choudhury" }]
dependencies = [
  "fastapi>=0.116,<1",
  "openai>=2,<3",
  "opentelemetry-api>=1.34,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
  "opentelemetry-sdk>=1.34,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "PyYAML>=6,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "integration_tests", "scripts"]
